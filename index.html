const $=id=>document.getElementById(id),app=$("app");window.$=$;

// ---- تشفير كلمات المرور (RSA-OAEP): المفتاح الخاص مع المالك فقط ----
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),A={name:"RSA-OAEP",hash:"SHA-256"};

function home(){
 app.innerHTML=`<section class="hero"><h1>ابدأ مع العبقري</h1><p>دورات مركّزة في البرمجة والثقافة المالية، وتدعمك خطوة بخطوة.</p><div class="chips"><span>🔒 دفع موثّق</span><span>💬 دعم مباشر</span><span>⚡ تفعيل سريع</span></div></section>
 <div class="grid">${Object.keys(SV).map((k,i)=>`<div class="card cp c${i}" data-n="${SV[k].n}"><div class="num">${i+1}</div><div style="font-size:2rem">${SV[k].i}</div><h3>${SV[k].n}</h3><p class="sub">${SV[k].d}</p><div class="price">${+S.prices[k]||0} ج.م</div><br><button onclick="buy('${k}')">اشترِ الآن</button></div>`).join("")}</div>`}

 <label>الاسم</label><input id="nm" maxlength="60"><label>رقم الواتساب</label><input id="wa" type="tel" dir="ltr" maxlength="16"><label>رقم الاتصال</label><input id="ph" type="tel" dir="ltr" maxlength="16">
 <label>تحب نكلمك على أنهي رقم؟</label><div class="seg"><label><input type="radio" name="cv" value="wa" checked> واتساب</label><label><input type="radio" name="cv" value="phone"> اتصال</label></div>
 <label>اسم المستخدم (حروف إنجليزية وأرقام)</label><input id="un" dir="ltr" maxlength="30" autocomplete="off"><label>كلمة المرور</label><input id="pw" maxlength="64" autocomplete="off">
 <input id="hp" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
 <p class="note">كلمة المرور بتتشفّر في جهازك قبل الإرسال ولا يقرأها إلا المالك. لا تستخدم باسورد حسابات أخرى.</p><p class="err" id="er"></p>
 <button onclick="toPay()">التالي: الدفع</button> <button class="g" onclick="go('')">رجوع</button></div>`};
window.toPay=()=>{const g=i=>$(i).value.trim();Object.assign(order,{name:g("nm"),wa:g("wa").replace(/[\s-]/g,""),phone:g("ph").replace(/[\s-]/g,""),via:(document.querySelector("input[name=cv]:checked")||{}).value||"wa",username:g("un"),password:g("pw"),hp:g("hp")});
 const o=order,bad=o.name.length<2?"اكتب الاسم":!/^\+?[0-9]{8,15}$/.test(o.wa)||!/^\+?[0-9]{8,15}$/.test(o.phone)?"أرقام الهاتف غير صحيحة":!/^[A-Za-z0-9_.-]{3,30}$/.test(o.username)?"اسم المستخدم: ٣-٣٠ حرف إنجليزي/رقم":o.password.length<6?"كلمة المرور ٦ حروف على الأقل":!OWN?"الموقع غير جاهز بعد، حاول لاحقًا":"";
 if(bad){$("er").textContent=bad;return}
 shot="";const p=S.pay,r=(l,v)=>v?`<div class="pay"><span>${l}</span><b>${esc(v)}</b><button class="g" onclick="cp('${esc(v)}')">نسخ</button></div>`:"";
 app.innerHTML=`<div class="card"><h2>الدفع — ${+S.prices[o.service]} ج.م</h2><p class="sub">حوّل المبلغ بإحدى الطرق ثم ارفع صورة التحويل.</p>${r("فودافون كاش",p.vodafone)}${r("وي باي",p.wepay)}${r("انستا باي",p.instapay)}${okUrl(p.qr)?`<p>أو امسح QR:</p><img src="${esc(p.qr)}" alt="QR" style="max-width:200px;border-radius:12px">`:""}
 <label>صورة التحويل (سكرين شوت)</label><input type="file" accept="image/*" onchange="pick(this)"><p class="err" id="er"></p><button id="sb" onclick="send()">إرسال الطلب</button> <button class="g" onclick="buy('${o.service}')">رجوع</button></div>`};
window.pick=f=>{const file=f.files[0];if(!file||!file.type.startsWith("image/"))return;const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,800/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);shot=c.toDataURL("image/jpeg",.6)};im.src=URL.createObjectURL(file)};

 const ok=()=>{app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:3rem">✅</div><h2>تم استلام طلبك</h2><p class="sub">هنكلمك على ${order.via==="phone"?"الاتصال":"الواتساب"} بعد مراجعة التحويل. تابع طلبك من «طلباتي».</p><button onclick="go('my')">طلباتي والشات</button></div>`};

  await b.commit();ok()}catch(e){$("sb").disabled=false;$("er").textContent="تعذّر الإرسال (قد تحتاج تنتظر دقيقة بين الطلبات)."}};

window.reg=async()=>{const e=$("em").value.trim(),p=$("ps").value,c=$("sc").value.trim();if(p.length<12||!c){$("er").textContent="كلمة المرور ١٢ حرفًا والكود مطلوب";return}
 try{const k=await genKeys(),u=(await createUserWithEmailAndPassword(auth,e,p)).user,b=writeBatch(db);

  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(k.priv)],{type:"application/json"}));a.download="abqari-owner-key.json";a.click();
  OWN={uid:u.uid,email:e,pub:k.pub};PK=k.priv;route()}catch(x){$("er").textContent="تعذّر الإنشاء (الكود غير صحيح أو المالك موجود بالفعل)"}};

function panel(){
 const f=(id,l,v)=>`<label>${l}</label><input id="${id}" value="${esc(v)}">`;
 app.innerHTML=`<div class="tabs"><button class="${tab==="o"?"":"g"}" onclick="tab='o';route()">الطلبات</button><button class="${tab==="s"?"":"g"}" onclick="tab='s';route()">الإعدادات</button><button class="g" onclick="logout()">خروج</button></div>
 ${tab==="o"?`<div class="card"><label>🔑 ملف مفتاح فك التشفير (لإظهار كلمات المرور)</label><input type="file" accept=".json" onchange="impK(this)"></div><div id="stats" class="grid st"></div><div class="tabs">${["all","جديد","تم التفعيل","مرفوض"].map(x=>`<button class="${flt===x?"":"g"}" onclick="setF('${x}')">${x==="all"?"الكل":x}</button>`).join("")}</div><div class="card" id="lst">جاري التحميل…</div><div id="chat"></div>`
 :`<div class="card">${f("s_py","سعر Python",S.prices.python)}${f("s_js","سعر JavaScript",S.prices.js)}${f("s_fin","سعر الثقافة المالية",S.prices.fin)}${f("p_v","فودافون كاش",S.pay.vodafone)}${f("p_w","وي باي",S.pay.wepay)}${f("p_i","انستا باي",S.pay.instapay)}${f("p_q","رابط صورة QR (https)",S.pay.qr)}${f("s_sup","واتساب الدعم (بكود الدولة)",S.support)}<button onclick="saveS()">حفظ</button> <span id="sv" style="color:var(--ok)"></span></div>`}`;
 if(tab==="o")unO=onSnapshot(query(collection(db,"orders"),orderBy("ts","desc")),q=>{OA={};q.docs.forEach(d=>OA[d.id]={id:d.id,...d.data()});const L=Object.values(OA);stats(L);
  if(!firstS)q.docChanges().forEach(c=>c.type==="added"&&!c.doc.metadata.hasPendingWrites&&(toast("🔔 طلب جديد!"),beep()));firstS=false;
  $("lst").innerHTML=L.filter(o=>flt==="all"||o.status===flt).map(o=>{const id=esc(o.id);return`<div class="row"><b>${esc(SV[o.service]?.n)}</b> <span class="tag">${esc(o.status)}</span> <span class="tag">يفضّل: ${o.via==="phone"?"الاتصال":"الواتساب"}</span>
  <div>👤 ${esc(o.name)} | 📱 <span dir="ltr">${esc(o.wa)}</span> | ☎️ <span dir="ltr">${esc(o.phone)}</span></div>
  <div>🆔 <span dir="ltr">${esc(o.username)}</span> 🔑 <button class="g" onclick="showPw('${id}',this)">إظهار الباسورد</button></div>${okImg(o.shot)?`<img src="${o.shot}" alt="تحويل" onclick="zoom(this)">`:""}
  ${o.via==="phone"?`<a class="btn" href="tel:${esc(o.phone)}">📞 اتصال</a>`:`<a class="btn" href="https://wa.me/${digits(o.wa)}?text=${encodeURIComponent("أهلاً "+o.name+"، معك العبقري بخصوص طلبك. ")}">💬 رسالة واتساب</a>`}
  <button onclick="chat('${id}')">شات</button> <button class="g" onclick="st('${id}','تم التفعيل')">تفعيل</button> <button class="g" onclick="st('${id}','مرفوض')">رفض</button> <button class="g" onclick="rm('${id}')">حذف</button></div>`}).join("")||"لا توجد طلبات."},()=>{$("lst").textContent="غير مصرح."})}
const stats=L=>{const ok=L.filter(o=>o.status==="تم التفعيل");$("stats").innerHTML=[["إجمالي الطلبات",L.length],["جديد",L.filter(o=>o.status==="جديد").length],["تم التفعيل",ok.length],["الإيراد (ج.م)",ok.reduce((t,o)=>t+(+o.price||0),0)]].map(([l,v])=>`<div class="card"><div class="num" style="font-size:2rem">${v}</div><span class="sub">${l}</span></div>`).join("")};
const beep=()=>{try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.2)}catch(e){}};
window.setF=v=>{flt=v;route()};window.st=(id,s)=>updateDoc(doc(db,"orders",id),{status:s});window.rm=id=>confirm("حذف الطلب؟")&&deleteDoc(doc(db,"orders",id));
window.saveS=async()=>{const v=i=>$(i).value.trim(),n=i=>Math.max(0,Math.min(1e5,+v(i)||0));
 await setDoc(doc(db,"settings","main"),{prices:{python:n("s_py"),js:n("s_js"),fin:n("s_fin")},pay:{vodafone:v("p_v"),wepay:v("p_w"),instapay:v("p_i"),qr:okUrl(v("p_q"))?v("p_q"):""},support:digits(v("s_sup")).slice(0,15)});$("sv").textContent="تم الحفظ ✓"};
window.route=route;Object.defineProperty(window,"tab",{get:()=>tab,set:v=>tab=v});

onSnapshot(doc(db,"settings","main"),s=>{if(s.exists()){S={...DEF,...s.data()};if(!adminMode||tab!=="s")route()}},()=>{});
let first=true;onAuthStateChanged(auth,async u=>{me=u;if(!u){signInAnonymously(auth).catch(()=>{});return}
 try{const s=await getDoc(doc(db,"config","owner"));OWN=s.exists()?s.data():OWN}catch(e){}route()});
route();
</script>
</body>
</html>
