 try{const b=writeBatch(db),o=order,oref=doc(collection(db,"orders"));b.set(doc(db,"users",me.uid),{lo:serverTimestamp()},{merge:true});
  b.set(oref,{service:o.service,name:o.name,wa:o.wa,phone:o.phone,via:o.via,username:o.username,pw:await enc(OWN.pub,o.password),price:+S.prices[o.service],shot,uid:me.uid,status:"new",ts:serverTimestamp()});
  await b.commit();ok(oref.id.slice(-6).toUpperCase())}catch(e){$("sb").disabled=false;$("er").textContent="تعذّر الإرسال: "+(e.code||e.message||"")+" — تأكد من نشر القواعد الأخيرة، وانتظر دقيقة بين كل طلب."}};

function chat(id){unC&&unC();$("chat").innerHTML=`<div class="card"><h3>الشات</h3><div id="ms" class="ms"></div><div style="display:flex;gap:8px"><input id="mt" maxlength="900" style="margin:0" placeholder="اكتب رسالة…" onkeydown="event.key==='Enter'&&sendM('${esc(id)}')"><button onclick="sendM('${esc(id)}')">إرسال</button></div></div>`;
 unC=onSnapshot(query(collection(db,"orders",id,"msgs"),orderBy("ts")),q=>{const w=adminMode?"a":"c";$("ms").innerHTML=q.docs.map(d=>{const m=d.data();return`<div class="m ${m.from===w?"me":""}">${esc(m.text)}</div>`}).join("");$("ms").scrollTop=1e9},()=>{})}
window.chat=chat;
window.sendM=async id=>{const t=$("mt").value.trim();if(!t)return;$("mt").value="";const b=writeBatch(db);
 if(!adminMode)b.set(doc(db,"users",me.uid),{lm:serverTimestamp()},{merge:true});
 b.set(doc(collection(db,"orders",id,"msgs")),{text:t.slice(0,900),from:adminMode?"a":"c",ts:serverTimestamp()});try{await b.commit()}catch(e){toast("انتظر ثانيتين بين الرسائل")}};

function my(){if(!me){app.innerHTML='<div class="card">جاري الاتصال…</div>';return}app.innerHTML=`<h2>طلباتي</h2><div class="card" id="lst">جاري التحميل…</div><div id="chat"></div>`;
 unO=onSnapshot(query(collection(db,"orders"),where("uid","==",me.uid)),q=>{const a=q.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(y.ts?.toMillis?.()||9e15)-(x.ts?.toMillis?.()||9e15));
  $("lst").innerHTML=a.map(o=>`<div class="row"><b>${esc(SV[o.service]?.n)}</b> <span class="tag">${esc(ST[o.status]||"")}</span> <button class="g" onclick="chat('${esc(o.id)}')">شات مع الدعم</button></div>`).join("")||"لا توجد طلبات على هذا الجهاز."},()=>{})}

// ---------------- المالك ----------------
function authForm(first){app.innerHTML=`<div class="card"><h2>${first?"إنشاء حساب المالك":"دخول المالك"}</h2>${first?'<p class="sub">أول حساب يُسجَّل بكود التفعيل يصبح المالك. سيُنزَّل ملف مفتاح فك التشفير — احتفظ به في مكان آمن.</p>':""}<label>البريد</label><input id="em" type="email" dir="ltr" autocomplete="username"><label>كلمة المرور (١٢ حرفًا فأكثر)</label><input id="ps" type="password" autocomplete="${first?"new-password":"current-password"}">${first?'<label>كود التفعيل (من ملف القواعد)</label><input id="sc" type="password" dir="ltr">':""}<p class="err" id="er"></p><button onclick="${first?"reg()":"login()"}">${first?"إنشاء الحساب":"دخول"}</button></div>`}
window.reg=async()=>{const e=$("em").value.trim(),p=$("ps").value,c=$("sc").value.trim();if(p.length<12||!/[A-Za-z]/.test(p)||!/\d/.test(p)||!c){$("er").textContent="كلمة المرور ١٢ حرفًا فأكثر بحروف وأرقام، وكود التفعيل مطلوب";return}
 $("er").textContent="جاري الإنشاء…";let step="مفاتيح التشفير";
 try{const k=await genKeys();let u;step="إنشاء الحساب";
  try{u=(await createUserWithEmailAndPassword(auth,e,p)).user}catch(x){if(x.code==="auth/email-already-in-use")u=(await signInWithEmailAndPassword(auth,e,p)).user;else throw x}
  step="حفظ المالك في قاعدة البيانات";const b=writeBatch(db);
  b.set(doc(db,"bootstrap",c),{uid:u.uid});b.set(doc(db,"config","owner"),{uid:u.uid,pub:k.pub});await b.commit();
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(k.priv)],{type:"application/json"}));a.download="abqari-owner-key.json";a.click();
  OWN={uid:u.uid,pub:k.pub};PK=k.priv;route()}catch(x){$("er").textContent="فشل في خطوة ("+step+"): "+(x.code||x.message||"")}};
window.login=async()=>{if(fails>=5&&Date.now()<+localStorage.lk){$("er").textContent="محاولات كثيرة، انتظر دقيقة";return}
 try{await setPersistence(auth,browserSessionPersistence);await signInWithEmailAndPassword(auth,$("em").value.trim(),$("ps").value);fails=localStorage.f=0}
 catch(e){localStorage.f=++fails;if(fails>=5)localStorage.lk=Date.now()+6e4;$("er").textContent="بيانات الدخول غير صحيحة"}};
window.logout=async()=>{PK=null;await signOut(auth);location.hash=""};
window.impK=f=>{const r=new FileReader();r.onload=async()=>{try{PK=JSON.parse(r.result);await dec(PK,await enc(OWN.pub,"t"));toast("تم تحميل المفتاح ✓")}catch(e){PK=null;toast("المفتاح غير صالح")}};r.readAsText(f.files[0])};
window.showPw=async(id,b)=>{if(!PK)return toast("استورد ملف المفتاح أولًا");try{b.textContent=await dec(PK,OA[id].pw);setTimeout(()=>{b.textContent="إظهار الباسورد"},15000)}catch(e){toast("تعذّر فك التشفير")}};
function admin(){
 if(!me){app.innerHTML='<div class="card">جاري التحميل…</div>';return}
 if(!OWN)return authForm(true);if(!me||me.isAnonymous)return authForm(false);
 if(OWN.uid!==me.uid){app.innerHTML=`<div class="card"><h3>🔒 هذا الحساب ليس المالك</h3><button onclick="logout()">خروج</button></div>`;return}
 clearTimeout(idle);idle=setTimeout(logout,9e5);panel()}
["click","keydown"].forEach(e=>addEventListener(e,()=>{if(adminMode&&idle){clearTimeout(idle);idle=setTimeout(logout,9e5)}}));
function panel(){
 const f=(id,l,v)=>`<label>${l}</label><input id="${id}" value="${esc(v)}">`;
 app.innerHTML=`<div class="tabs"><button class="${tab==="o"?"":"g"}" onclick="tab='o';route()">الطلبات</button><button class="${tab==="m"?"":"g"}" onclick="tab='m';route()">الصور</button><button class="${tab==="s"?"":"g"}" onclick="tab='s';route()">الإعدادات</button><button class="g" onclick="logout()">خروج</button></div>
 ${tab==="o"?`<div class="card"><label>🔑 ملف مفتاح فك التشفير (لإظهار كلمات المرور)</label><input type="file" accept=".json" onchange="impK(this)"></div><div id="stats" class="grid st"></div><div class="tabs">${["all","new","ok","no"].map(x=>`<button class="${flt===x?"":"g"}" onclick="setF('${x}')">${x==="all"?"الكل":ST[x]}</button>`).join("")}</div><input id="oq" placeholder="ابحث بالاسم أو الرقم أو اسم المستخدم…" oninput="fq(this.value)" style="margin-bottom:10px"><button class="g" onclick="csv()" style="margin-bottom:10px">تصدير CSV</button><div class="card" id="lst">جاري التحميل…</div><div id="chat"></div>`
 :tab==="m"?`<div class="card"><h3>رفع صورة (لأي مكان)</h3><p class="sub">بتترفع على Cloudinary برابط آمن، ومحدش غيرك يقدر يرفع.</p><input type="file" accept="image/*" onchange="freeUp(this)"><div id="mres"></div></div>
 <div class="card"><h3>أماكن الصور في الموقع</h3>${[["logo","الشعار"],["hero","خلفية الواجهة"],["python","صورة Python"],["js","صورة JavaScript"],["fin","صورة الثقافة المالية"],["qr","QR الدفع"]].map(([k,l])=>`<div class="row"><b>${l}</b>${slotImg(k)?`<img src="${esc(slotImg(k))}" alt="" style="max-height:70px;display:block;background:#fff;border-radius:10px;padding:4px;margin:6px 0">`:""}<input type="file" accept="image/*" onchange="slotUp('${k}',this)"> <button class="g" onclick="slotDel('${k}')">إزالة</button></div>`).join("")}</div>
 <div class="card"><h3>مكتبة الصور</h3><div id="lib" class="grid st">جاري التحميل…</div></div>`
 :`<div class="card">${f("s_py","سعر Python",S.prices.python)}${f("s_js","سعر JavaScript",S.prices.js)}${f("s_fin","سعر الثقافة المالية",S.prices.fin)}${f("p_v","فودافون كاش",S.pay.vodafone)}${f("p_w","وي باي",S.pay.wepay)}${f("p_i","انستا باي",S.pay.instapay)}<label>صورة QR للدفع (ارفع لقطة شاشة الـ QR الخاص بك)</label><input type="file" accept="image/*" onchange="qrUp(this)"><input type="hidden" id="p_q" value="${esc(S.pay.qr)}"><img id="qp" alt="QR" src="${okUrl(S.pay.qr)?esc(S.pay.qr):""}" style="max-width:160px;background:#fff;padding:8px;border-radius:12px;margin-bottom:10px;display:${okUrl(S.pay.qr)?"block":"none"}"> <button class="g" onclick="$('p_q').value='';$('qp').style.display='none'">حذف الـ QR</button><br><br>${f("s_sup","واتساب الدعم (بكود الدولة)",S.support)}<button onclick="saveS()">حفظ</button> <span id="sv" style="color:var(--ok)"></span></div>`}`;
 if(tab==="o")unO=onSnapshot(query(collection(db,"orders"),orderBy("ts","desc")),q=>{OA={};q.docs.forEach(d=>OA[d.id]={id:d.id,...d.data()});const L=Object.values(OA);stats(L);
  if(!firstS)q.docChanges().forEach(c=>c.type==="added"&&!c.doc.metadata.hasPendingWrites&&(toast("🔔 طلب جديد!"),beep()));firstS=false;
  $("lst").innerHTML=L.filter(o=>flt==="all"||o.status===flt).map(o=>{const id=esc(o.id);return`<div class="row" data-s="${esc([o.name,o.wa,o.phone,o.username].join(" ").toLowerCase())}"><b>${esc(SV[o.service]?.n)}</b> <span class="tag">${esc(ST[o.status]||"")}</span> <span class="tag">يفضّل: ${o.via==="phone"?"الاتصال":"الواتساب"}</span>
  <span class="tag">${o.ts&&o.ts.toDate?o.ts.toDate().toLocaleString("ar-EG"):""}</span><div>👤 ${esc(o.name)} | 📱 <span dir="ltr">${esc(o.wa)}</span> | ☎️ <span dir="ltr">${esc(o.phone)}</span></div>
  <div>🆔 <span dir="ltr">${esc(o.username)}</span> 🔑 <button class="g" onclick="showPw('${id}',this)">إظهار الباسورد</button></div>${okImg(o.shot)?`<img src="${o.shot}" alt="تحويل" onclick="zoom(this)">`:""}
  ${o.via==="phone"?`<a class="btn" href="tel:${esc(o.phone)}">📞 اتصال</a>`:`<a class="btn" href="https://wa.me/${digits(o.wa)}?text=${encodeURIComponent("أهلاً "+o.name+"، معك العبقري بخصوص طلبك. ")}">💬 رسالة واتساب</a>`}
  <button onclick="chat('${id}')">شات</button> <button class="g" onclick="st('${id}','ok')">تفعيل</button> <button class="g" onclick="st('${id}','no')">رفض</button> <button class="g" onclick="rm('${id}')">حذف</button></div>`}).join("")||"لا توجد طلبات."},()=>{$("lst").textContent="غير مصرح."});
 if(tab==="m")unO=onSnapshot(query(collection(db,"media"),orderBy("ts","desc")),q=>{$("lib").innerHTML=q.docs.map(d=>{const m=d.data();return okCld(m.url)?`<div class="card"><img src="${esc(m.url)}" alt="" style="width:100%;border-radius:10px"><button class="g" data-u="${esc(m.url)}" onclick="cp(this.dataset.u)">نسخ الرابط</button> <button class="g" onclick="mdel('${esc(d.id)}')">حذف</button></div>`:""}).join("")||"لا توجد صور بعد."},()=>{})}
const okCld=u=>/^https:\/\/res\.cloudinary\.com\/[\w.-]+\/image\/upload\/[\w\-.,/%:]+$/.test(u||""),slotImg=k=>k==="qr"?S.pay.qr:(S.img||{})[k];
window.upImg=async f=>{if(!f||!f.type.startsWith("image/")||f.size>8e6)throw new Error("صورة فقط وأقل من 8MB");const t=await auth.currentUser.getIdToken(),r=await fetch("/api/sign",{method:"POST",headers:{Authorization:"Bearer "+t}});const g=await r.json().catch(()=>({}));if(!r.ok)throw new Error(g.error==="missing"?"ناقص في Vercel: "+g.names.join(" , "):"فشل التوقيع ("+r.status+": "+(g.error||"")+")");const fd=new FormData();fd.append("file",f);fd.append("api_key",g.apiKey);fd.append("timestamp",g.timestamp);fd.append("signature",g.signature);fd.append("folder",g.folder);const u=await(await fetch(`https://api.cloudinary.com/v1_1/${g.cloudName}/image/upload`,{method:"POST",body:fd})).json();if(!u.secure_url)throw new Error((u.error&&u.error.message)||"فشل الرفع");return u.secure_url.replace("/upload/","/upload/f_auto,q_auto/")};
const saveFull=()=>setDoc(doc(db,"settings","main"),{prices:S.prices,pay:S.pay,support:S.support,img:S.img||{}});
window.slotUp=async(k,i)=>{try{toast("جاري الرفع…");const u=await upImg(i.files[0]);k==="qr"?(S.pay={...S.pay,qr:u}):(S.img={...(S.img||{}),[k]:u});await saveFull();toast("تم ✓");route()}catch(e){toast(e.message)}};
window.slotDel=async k=>{k==="qr"?(S.pay={...S.pay,qr:""}):(S.img={...(S.img||{}),[k]:""});await saveFull();route()};
window.freeUp=async i=>{try{toast("جاري الرفع…");const u=await upImg(i.files[0]);await addDoc(collection(db,"media"),{url:u,ts:Date.now()});$("mres").innerHTML=`<p class="sub">الرابط:</p><input readonly value="${esc(u)}" onclick="this.select()" dir="ltr">`}catch(e){toast(e.message)}};
window.mdel=id=>confirm("حذف من المكتبة؟")&&deleteDoc(doc(db,"media",id));
const stats=L=>{const ok=L.filter(o=>o.status==="ok");$("stats").innerHTML=[["إجمالي الطلبات",L.length],["جديد",L.filter(o=>o.status==="new").length],["تم التفعيل",ok.length],["الإيراد (ج.م)",ok.reduce((t,o)=>t+(+o.price||0),0)]].map(([l,v])=>`<div class="card"><div class="num" style="font-size:2rem">${v}</div><span class="sub">${l}</span></div>`).join("")};
const beep=()=>{try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.2)}catch(e){}};
window.setF=v=>{flt=v;route()};
window.qrUp=f=>{const file=f.files[0];if(!file||!file.type.startsWith("image/"))return;const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,480/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);const u=c.toDataURL("image/png");$("p_q").value=u;$("qp").src=u;$("qp").style.display="block";toast("تم تحميل الـ QR — اضغط حفظ")};im.src=URL.createObjectURL(file)};
window.fq=v=>document.querySelectorAll("#lst .row").forEach(r=>r.style.display=(r.dataset.s||"").includes(v.trim().toLowerCase())?"":"none");
window.csv=()=>{const q=c=>'"'+String(c??"").replace(/"/g,'""').replace(/^[=+\-@]/,"'$&")+'"',rows=[["الخدمة","الاسم","واتساب","اتصال","المستخدم","الحالة","السعر"],...Object.values(OA).map(o=>[SV[o.service]?.n,o.name,o.wa,o.phone,o.username,ST[o.status],o.price])];
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"}));a.download="orders.csv";a.click()};window.st=(id,s)=>updateDoc(doc(db,"orders",id),{status:s});window.rm=id=>confirm("حذف الطلب؟")&&deleteDoc(doc(db,"orders",id));
window.saveS=async()=>{const v=i=>$(i).value.trim(),n=i=>Math.max(0,Math.min(1e5,+v(i)||0));
 await setDoc(doc(db,"settings","main"),{prices:{python:n("s_py"),js:n("s_js"),fin:n("s_fin")},pay:{vodafone:v("p_v"),wepay:v("p_w"),instapay:v("p_i"),qr:okUrl(v("p_q"))?v("p_q"):""},support:digits(v("s_sup")).slice(0,15),img:S.img||{}});$("sv").textContent="تم الحفظ ✓"};
window.route=route;Object.defineProperty(window,"tab",{get:()=>tab,set:v=>tab=v});

onSnapshot(doc(db,"settings","main"),s=>{if(s.exists()){S={...DEF,...s.data()};if(!adminMode||tab!=="s")route()}},()=>{});
let first=true;onAuthStateChanged(auth,async u=>{me=u;if(!u){signInAnonymously(auth).catch(e=>{authErr=e.code||"";toast("تعذّر الاتصال: "+authErr)});return}
 try{const s=await getDoc(doc(db,"config","owner"));OWN=s.exists()?s.data():OWN}catch(e){}route()});
route();
</script>
